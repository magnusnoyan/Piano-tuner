<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stämton</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF1;--panel:#F7F9FA;--ink:#17242D;--mute:#56666F;--line:#C3CED5;--accent:#0B7A85;--accent-ink:#fff;--wkey:#FBFCFC;--bkey:#1E2A32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A20;--panel:#16242C;--ink:#E6EEF1;--mute:#8FA2AD;--line:#2B3D47;--accent:#3CC0CC;--accent-ink:#06262A;--wkey:#DCE5E9;--bkey:#0A1216}}
:root[data-theme="dark"]{--bg:#0F1A20;--panel:#16242C;--ink:#E6EEF1;--mute:#8FA2AD;--line:#2B3D47;--accent:#3CC0CC;--accent-ink:#06262A;--wkey:#DCE5E9;--bkey:#0A1216}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:'Familjen Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
main{height:100%;max-width:760px;margin:0 auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:is(button,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:10px;flex:none;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.note{font-size:clamp(56px,17vw,84px);font-weight:700;line-height:.85;letter-spacing:-.04em}
.cents{margin-top:6px;color:var(--mute);font-size:15px}
.fr{text-align:right}
.fr .row{display:flex;align-items:baseline;justify-content:flex-end;gap:6px}
#freq{width:6ch;font-size:clamp(30px,9vw,44px);font-weight:600;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;text-align:right;padding:0;-moz-appearance:textfield;appearance:textfield}
#freq::-webkit-outer-spin-button,#freq::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#freq:focus{outline:none;border-bottom-color:var(--accent)}
.unit{font-size:18px;color:var(--mute)}
.steps{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.steps button,.nav button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px}
.steps button:active,.nav button:active{background:var(--line)}
#scope{width:100%;height:48px;display:block}
.play{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700}
.play[aria-pressed="true"]{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.waves{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.waves button{background:transparent;border:0;padding:11px 2px;font-size:15px}
.waves button+button{border-left:1px solid var(--line)}
.waves button[aria-checked="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.set{display:flex;gap:14px;align-items:center}
.set label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.set .v{flex:1;min-width:0}
input[type=range]{width:100%;min-width:0;accent-color:var(--accent)}
#a4{width:6.5ch;font-size:16px;padding:6px 8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:right}
.kb{flex:1;min-height:150px;min-width:0;display:flex;flex-direction:column;gap:6px}
.kh{display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:14px;color:var(--mute)}
.nav{display:flex;gap:6px}
.kbd{flex:1;min-height:0;min-width:0;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.keys{position:relative;height:100%}
.key{position:absolute;top:0;padding:0;border:1px solid var(--line)}
.key.w{width:34px;height:100%;background:var(--wkey);border-radius:0 0 6px 6px;color:var(--mute);font-size:11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.key.b{width:20px;height:60%;background:var(--bkey);border-color:var(--bkey);border-radius:0 0 4px 4px;z-index:2}
.key.on.w{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key.on.b{background:var(--accent);border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.play.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.play.alt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#meter{display:none;gap:6px;min-height:68px;align-content:center}
body.listening #scope{display:none}
body.listening #meter{display:grid}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#mtxt{font-size:22px;font-weight:600;white-space:nowrap}
#mlbl{font-size:14px;color:var(--mute);text-align:right}
.track{position:relative;height:12px;border-radius:6px;background:var(--line)}
.tick{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.5}
#mark{position:absolute;left:50%;top:-4px;bottom:-4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--mute);transition:left .12s}
#mark.ok{background:var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
@media (orientation:landscape) and (max-height:520px){
  main{flex-direction:row;max-width:none}
  .panel{width:46%;overflow-y:auto;min-height:0}
  .kb{min-height:0}
  #scope{display:none}
  .note{font-size:56px}
}
</style>
</head>
<body>
<main>
  <div class="panel">
    <section class="card" aria-label="Ton">
      <div class="top">
        <div>
          <div class="note" id="noteName">A4</div>
          <div class="cents" id="cents">Rent</div>
        </div>
        <div class="fr">
          <div class="row">
            <input id="freq" type="number" inputmode="decimal" step="0.1" min="20" max="8000" value="440.0" aria-label="Frekvens i hertz">
            <span class="unit">Hz</span>
          </div>
          <div class="steps">
            <button type="button" data-step="-1">−1</button>
            <button type="button" data-step="-0.1">−0,1</button>
            <button type="button" data-step="0.1">+0,1</button>
            <button type="button" data-step="1">+1</button>
          </div>
        </div>
      </div>
      <canvas id="scope" aria-hidden="true"></canvas>
      <div id="meter" aria-live="polite">
        <div class="mrow"><span id="mtxt">–</span><span id="mlbl">Spela en ton på pianot</span></div>
        <div class="track"><i class="tick"></i><b id="mark"></b></div>
        <div class="ends"><span>−50</span><span>0</span><span>+50 cent</span></div>
      </div>
      <div class="btns">
        <button type="button" class="play" id="play" aria-pressed="false">Spela</button>
        <button type="button" class="play alt" id="listen" aria-pressed="false">Lyssna</button>
      </div>
    </section>

    <div class="waves" role="radiogroup" aria-label="Vågform">
      <button type="button" role="radio" data-w="sine" aria-checked="true">Sinus</button>
      <button type="button" role="radio" data-w="square" aria-checked="false">Fyrkant</button>
      <button type="button" role="radio" data-w="sawtooth" aria-checked="false">Sågtand</button>
      <button type="button" role="radio" data-w="triangle" aria-checked="false">Triangel</button>
    </div>

    <div class="set">
      <label class="v">Volym <input id="vol" type="range" min="0" max="1" step="0.01" value="0.5"></label>
      <label>A4 <input id="a4" type="number" inputmode="decimal" step="0.1" min="400" max="480" value="440.0"></label>
    </div>
  </div>

  <section class="kb">
    <div class="kh">
      <span class="lbl">A0 till C8</span>
      <div class="nav">
        <button type="button" id="dn" aria-label="Halvton ned">Halvton ned</button>
        <button type="button" id="up" aria-label="Halvton upp">Halvton upp</button>
      </div>
    </div>
    <div class="kbd" id="kbd"><div class="keys" id="keys"></div></div>
  </section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','B','H'];
  var GAIN={sine:1,triangle:1,square:.3,sawtooth:.35};
  var W=34, BLACK=[1,3,6,8,10];
  var a4=440, freq=440, wave='sine', vol=.5, playing=false, actx=null, osc=null, gain=null;
  var keyEls={}, activeMidi=null;

  function name(m){return NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1)}
  function hz(m){return a4*Math.pow(2,(m-69)/12)}
  function midiOf(f){return 69+12*Math.log2(f/a4)}
  function level(){return vol*vol*.5*GAIN[wave]}
  function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}

  /* Tangenter */
  var keysEl=$('keys'), kbd=$('kbd'), wi=0;
  for(var m=21;m<=108;m++){
    (function(m){
      var black=BLACK.indexOf(m%12)>=0;
      var b=document.createElement('button');
      b.type='button';
      b.className='key '+(black?'b':'w');
      b.style.left=(black?wi*W-10:wi*W)+'px';
      b.setAttribute('aria-label',name(m));
      if(!black){
        wi++;
        if(m%12===0) b.textContent=name(m);
      }
      b.addEventListener('click',function(){setFreq(hz(m),'key');if(!playing&&!listening)start()});
      keysEl.appendChild(b);
      keyEls[m]=b;
    })(m);
  }
  keysEl.style.width=(wi*W)+'px';

  /* Ljud */
  function start(){
    unlisten();
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.resume) actx.resume();
    osc=actx.createOscillator();
    gain=actx.createGain();
    gain.gain.value=0;
    osc.type=wave;
    osc.frequency.value=freq;
    osc.connect(gain);gain.connect(actx.destination);
    osc.start();
    gain.gain.setTargetAtTime(level(),actx.currentTime,.02);
    playing=true;paintPlay();
  }
  function stop(){
    if(!playing) return;
    gain.gain.setTargetAtTime(0,actx.currentTime,.02);
    osc.stop(actx.currentTime+.2);
    osc=null;gain=null;playing=false;paintPlay();
  }
  function paintPlay(){
    var p=$('play');
    p.setAttribute('aria-pressed',playing?'true':'false');
    p.textContent=playing?'Stoppa':'Spela';
  }

  /* Vågbild */
  function drawScope(){
    var c=$('scope'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
    if(!w) return;
    c.width=w*dpr;c.height=h*dpr;
    var g=c.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    var cs=getComputedStyle(document.documentElement);
    g.strokeStyle=cs.getPropertyValue('--line');g.lineWidth=1;
    g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
    g.strokeStyle=cs.getPropertyValue('--accent');g.lineWidth=2.5;g.lineJoin='round';
    g.beginPath();
    var cycles=3,pad=10,amp=h/2-pad;
    for(var x=0;x<=w;x++){
      var p=(x/w*cycles)%1,y;
      if(wave==='sine') y=Math.sin(2*Math.PI*p);
      else if(wave==='square') y=p<.5?1:-1;
      else if(wave==='sawtooth') y=2*p-1;
      else y=p<.25?4*p:(p<.75?2-4*p:4*p-4);
      var py=h/2-y*amp;
      x?g.lineTo(x,py):g.moveTo(x,py);
    }
    g.stroke();
  }

  /* Tillstånd och rendering */
  function setFreq(f,src){freq=clamp(f,20,8000);render(src)}
  function render(src){
    var m=midiOf(freq),mi=Math.round(m),cents=(m-mi)*100;
    $('noteName').textContent=(mi>=0&&mi<=127)?name(mi):'–';
    $('cents').textContent=Math.abs(cents)<.05?'Rent':(cents>0?'+':'−')+Math.abs(cents).toFixed(1).replace('.',',')+' cent';
    if(src!=='input') $('freq').value=freq.toFixed(1);
    if(activeMidi!==null&&keyEls[activeMidi]) keyEls[activeMidi].classList.remove('on');
    activeMidi=keyEls[mi]?mi:null;
    if(activeMidi!==null){
      keyEls[mi].classList.add('on');
      if(src==='step'||src==='init'||src==='input'||src==='a4'){
        kbd.scrollTo({left:keyEls[mi].offsetLeft-kbd.clientWidth/2+W/2,behavior:src==='init'?'auto':'smooth'});
      }
    }
    if(playing) osc.frequency.setTargetAtTime(freq,actx.currentTime,.005);
    drawScope();
  }

  /* Händelser */
  $('play').addEventListener('click',function(){playing?stop():start()});
  document.querySelectorAll('.waves button').forEach(function(b){
    b.addEventListener('click',function(){
      wave=b.dataset.w;
      document.querySelectorAll('.waves button').forEach(function(x){x.setAttribute('aria-checked',x===b?'true':'false')});
      if(playing){osc.type=wave;gain.gain.setTargetAtTime(level(),actx.currentTime,.02)}
      drawScope();
    });
  });
  $('vol').addEventListener('input',function(e){
    vol=parseFloat(e.target.value);
    if(playing) gain.gain.setTargetAtTime(level(),actx.currentTime,.02);
  });
  $('freq').addEventListener('input',function(e){
    var v=parseFloat(e.target.value);
    if(isFinite(v)&&v>=20&&v<=8000) setFreq(v,'input');
  });
  $('freq').addEventListener('change',function(){
    var v=parseFloat($('freq').value);
    setFreq(isFinite(v)?v:freq,'');
  });
  document.querySelectorAll('.steps button').forEach(function(b){
    b.addEventListener('click',function(){
      var base=Math.round(freq*10)/10;
      setFreq(Math.round((base+parseFloat(b.dataset.step))*10)/10,'');
    });
  });
  $('a4').addEventListener('change',function(e){
    var v=parseFloat(e.target.value);
    if(!isFinite(v)) v=a4;
    v=clamp(v,400,480);
    var m=midiOf(freq),mi=Math.round(m),wasOn=Math.abs((m-mi)*100)<.05;
    a4=v;e.target.value=v.toFixed(1);
    if(wasOn) freq=clamp(hz(mi),20,8000);
    render('a4');
  });
  function semitone(d){
    var m=midiOf(freq);
    var t=d>0?Math.floor(m+1e-6)+1:Math.ceil(m-1e-6)-1;
    setFreq(hz(clamp(t,21,108)),'step');
  }
  $('up').addEventListener('click',function(){semitone(1)});
  $('dn').addEventListener('click',function(){semitone(-1)});
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'){semitone(1);e.preventDefault()}
    if(e.key==='ArrowLeft'){semitone(-1);e.preventDefault()}
  });
  window.addEventListener('resize',drawScope);

  /* Lyssna: tonhöjdsmätning */
  var listening=false,stream=null,an=null,msrc=null,timer=null,tbuf=null,hist=[],miss=0,HANN=null;
  function say(t,l){$('mtxt').textContent=t;$('mlbl').textContent=l}
  function mark(c){
    var m=$('mark');
    if(c===null){m.style.left='50%';m.className='';return}
    m.style.left=(50+clamp(c,-50,50))+'%';
    m.className=Math.abs(c)<1?'ok':'';
  }
  function paintListen(){
    var b=$('listen');
    b.setAttribute('aria-pressed',listening?'true':'false');
    b.textContent=listening?'Sluta lyssna':'Lyssna';
  }
  async function listen(){
    if(playing) stop();
    document.body.classList.add('listening');
    mark(null);say('–','Ber om mikrofon');
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){
      var n=(e&&e.name)||'Okänt fel';
      say('Fel',n+(n==='NotAllowedError'?': mikrofonen är blockerad här':n==='NotFoundError'?': ingen mikrofon hittades':n==='TypeError'?': mikrofon ej tillgänglig i det här fönstret':''));
      return;
    }
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.resume) actx.resume();
    msrc=actx.createMediaStreamSource(stream);
    an=actx.createAnalyser();an.fftSize=16384;an.smoothingTimeConstant=0;
    msrc.connect(an);
    tbuf=new Float32Array(an.fftSize);
    hist=[];miss=0;listening=true;paintListen();
    say('–','Spela en ton på pianot');
    timer=setInterval(analyse,120);
  }
  function unlisten(){
    if(timer){clearInterval(timer);timer=null}
    if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
    if(msrc){msrc.disconnect();msrc=null}
    an=null;listening=false;
    document.body.classList.remove('listening');paintListen();
  }
  function analyse(){
    if(!an) return;
    an.getFloatTimeDomainData(tbuf);
    var N=tbuf.length,i,rms=0;
    for(i=0;i<N;i++) rms+=tbuf[i]*tbuf[i];
    rms=Math.sqrt(rms/N);
    var f=rms>.003?detect(tbuf,actx.sampleRate,freq):0;
    if(!f){
      if(++miss>3){hist=[];mark(null);say('–','Ingen tydlig ton nära vald ton')}
      return;
    }
    miss=0;
    hist.push(1200*Math.log2(f/freq));
    if(hist.length>5) hist.shift();
    var s=hist.slice().sort(function(a,b){return a-b})[hist.length>>1];
    var d=freq*(Math.pow(2,s/1200)-1);
    say((s>0?'+':'−')+Math.abs(s).toFixed(1).replace('.',',')+' cent',
      Math.abs(s)<1?'Rent':(s>0?'För hög':'För låg')+' ('+(d>0?'+':'−')+Math.abs(d).toFixed(2).replace('.',',')+' Hz)');
    mark(s);
  }
  /* Grov skattning: normaliserad autokorrelation nära vald ton */
  function detect(buf,sr,t){
    var N=buf.length,tau0=sr/t,lo=Math.max(2,Math.floor(tau0/1.19)),hi=Math.ceil(tau0*1.19);
    var W=N-hi-2;
    if(W<N/2) return 0;
    var r=[],best=-1,bt=0,tau,j,num,den,a,b,v;
    for(tau=lo-1;tau<=hi+1;tau++){
      num=0;den=0;
      for(j=0;j<W;j++){a=buf[j];b=buf[j+tau];num+=a*b;den+=a*a+b*b}
      r[tau-lo+1]=den>0?2*num/den:0;
    }
    for(tau=lo;tau<=hi;tau++){v=r[tau-lo+1];if(v>best){best=v;bt=tau}}
    if(best<.75||bt===lo||bt===hi) return 0;
    var y0=r[bt-lo],y1=r[bt-lo+1],y2=r[bt-lo+2],dn=y0-2*y1+y2;
    var fc=sr/(bt+(dn?.5*(y0-y2)/dn:0));
    return fc>=150?refine(buf,sr,fc):fc;
  }
  /* Finjustering för höga toner: fönstrad DFT-svep kring grov skattning */
  function refine(buf,sr,fc){
    var N=buf.length,hi=fc>=500,M=hi?8192:16384,off=N-M,i,k,K=hi?40:20,step=hi?1.5:3,p=[],bi=0,bp=-1;
    HANN=HANN||{};
    if(!HANN[M]){HANN[M]=new Float32Array(M);for(i=0;i<M;i++)HANN[M][i]=.5-.5*Math.cos(2*Math.PI*i/(M-1))}
    var x=new Float32Array(M);
    for(i=0;i<M;i++) x[i]=buf[off+i]*HANN[M][i];
    for(k=-K;k<=K;k++){
      var w=2*Math.PI*fc*Math.pow(2,k*step/1200)/sr,cs=Math.cos(w),sn=Math.sin(w),cr=1,ci=0,re=0,im=0,t;
      for(i=0;i<M;i++){re+=x[i]*cr;im+=x[i]*ci;t=cr*cs-ci*sn;ci=cr*sn+ci*cs;cr=t}
      var pw=re*re+im*im;
      p.push(pw);
      if(pw>bp){bp=pw;bi=k+K}
    }
    if(bi===0||bi===2*K) return fc;
    var a=Math.log(p[bi-1]+1e-30),b=Math.log(p[bi]+1e-30),c=Math.log(p[bi+1]+1e-30),dn=a-2*b+c;
    return fc*Math.pow(2,((bi-K)+(dn?.5*(a-c)/dn:0))*step/1200);
  }
  $('listen').addEventListener('click',function(){listening?unlisten():listen()});

  render('init');
})();
</script>
</body>
</html>
